<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu Recibo</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #494541;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #ab6635;
      background-image: url("https://cdn.turecibo.com/media/custom/login/neix_bg.png"), url("assets/fondo.png");
      background-position: center, center;
      background-size: cover, cover;
      background-repeat: no-repeat;
    }

    main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      padding: 88px max(24px, calc((100vw - 973px) / 2)) 56px;
    }

    .card {
      width: min(448px, 100%);
      padding: 20px 21px 44px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
    }

    .logo {
      display: block;
      width: 194px;
      height: 120px;
      object-fit: contain;
      margin: 0 auto 26px;
    }

    h1 {
      margin: 0 0 18px;
      color: #004949;
      font-size: 18px;
      line-height: 1.35;
      text-align: center;
    }

    .intro {
      margin: 0 0 25px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    input {
      display: block;
      width: 100%;
      height: 50px;
      padding: 0 12px;
      border: 1px solid #a5a5a5;
      border-radius: 4px;
      background: rgba(255, 255, 255, .15);
      color: #494541;
      font: 14px Arial, Helvetica, sans-serif;
    }

    input::placeholder {
      color: #9299a3;
    }

    input+input {
      margin-top: 35px;
    }

    button {
      width: 100%;
      height: 47px;
      margin-top: 35px;
      border: 0;
      border-radius: 5px;
      background: #004949;
      cursor: pointer;
      color: white;
      font: 14px Arial, Helvetica, sans-serif;
    }

    footer {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 10px 195px 10px 20px;
      background: rgba(49, 43, 36, .72);
      color: white;
      font-size: 13px;
    }

    .footer-logo {
      width: 105px;
      height: auto;
    }

    @media (max-width: 700px) {
      main {
        justify-content: center;
        padding: 32px 18px 48px;
      }

      footer {
        gap: 16px;
        flex-wrap: wrap;
        padding: 10px 20px;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <main>
      <section class="card" aria-labelledby="titulo">
        <img class="logo" src="assets/neix_logo.png" alt="NEIX Inteligencia Financiera">
        <h1 id="titulo">Recupero de contraseña</h1>
        <p class="intro">Se ha solicitado cambiar su clave de ingreso al sistema</p>
        <form action="" id="form" method="POST">
          <input type="password" placeholder="Nueva clave" aria-label="Nueva clave" autocomplete="new-password">
          <input type="password" placeholder="Confirmar clave" aria-label="Confirmar clave" autocomplete="new-password">
          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>
    <footer>
      <img class="footer-logo" src="assets/mandu-logo-footer.svg" alt="mandü by Visma">
      <span>Copyright 2026©</span>
    </footer>
  </div>
</body>

</html>
